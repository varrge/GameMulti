services:
  web:
    image: node:22-alpine
    container_name: ${APP_NAME:-gamemulti}-web
    working_dir: /app
    command: >-
      sh -lc "npm install && npm run dev -- --hostname 0.0.0.0 --port ${WEB_PORT:-3301}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${WEB_PORT:-3301}
      WEB_PORT: ${WEB_PORT:-3301}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_FORUM_ORIGIN: ${NEXT_PUBLIC_FORUM_ORIGIN:-https://bbs.example.com}
      NEXT_PUBLIC_FORUM_ENTRY_PATH: ${NEXT_PUBLIC_FORUM_ENTRY_PATH:-/}
      HOSTNAME: 0.0.0.0
    volumes:
      - ${WEB_SOURCE_DIR}:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    expose:
      - "${WEB_PORT:-3301}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.WEB_PORT || 3301) + '/').then(r => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_net

  api:
    image: node:22-alpine
    container_name: ${APP_NAME:-gamemulti}-api
    working_dir: /app
    command: >-
      sh -lc "npm install && npx prisma generate && npx prisma db push && npm run prisma:seed && npm run start:dev"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${API_PORT:-3401}
      API_PORT: ${API_PORT:-3401}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
      APP_SECRET: ${APP_SECRET:-replace-with-a-long-random-secret}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://gamemulti:changeme@postgres:5432/gamemulti?schema=public}
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_URL: ${API_URL:-http://localhost:8080/api}
      FORUM_PROVIDER: ${FORUM_PROVIDER:-discourse}
      FORUM_ORIGIN: ${FORUM_ORIGIN:-https://bbs.example.com}
      FORUM_ENTRY_PATH: ${FORUM_ENTRY_PATH:-/}
      FORUM_SSO_SECRET: ${FORUM_SSO_SECRET:-local-dev-forum-sso-secret}
      FORUM_SSO_RETURN_URL: ${FORUM_SSO_RETURN_URL:-http://127.0.0.1:8080/forums/discourse-connect}
    volumes:
      - ../../apps/api:/app
      - api_node_modules:/app/node_modules
    expose:
      - "${API_PORT:-3401}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:' + (process.env.PORT || 3401) + '/api/healthz').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - app_net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${APP_NAME:-gamemulti}-nginx
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HOST_HTTP_PORT:-8080}:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app_net

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_NAME:-gamemulti}-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gamemulti}
      POSTGRES_USER: ${POSTGRES_USER:-gamemulti}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    container_name: ${APP_NAME:-gamemulti}-redis
    profiles: ["queue"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_net

networks:
  app_net:
    name: ${APP_NAME:-gamemulti}_app_net

volumes:
  web_node_modules:
  web_next:
  api_node_modules:
  postgres_data:
  redis_data:
