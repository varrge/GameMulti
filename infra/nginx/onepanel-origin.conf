map $http_x_forwarded_proto $trusted_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    # The DOCKER-USER allowlist restricts this origin to the same VPS.
    set_real_ip_from 64.90.1.22;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = / {
        access_log off;
        default_type text/plain;
        return 200 'GameMulti Bridge\n';
    }

    location / {
        default_type text/plain;
        return 404 'GameMulti Bridge API only\n';
    }

    location /api/ {
        proxy_pass http://api:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    }

    location /bind/ {
        proxy_pass http://api:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $trusted_forwarded_proto;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
